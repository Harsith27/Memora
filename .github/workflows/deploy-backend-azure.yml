name: Deploy Backend to Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - memora-backend/**
      - .github/workflows/deploy-backend-azure.yml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: memora-backend/package-lock.json

      - name: Install dependencies
        working-directory: memora-backend
        run: npm ci

      - name: Package Backend
        run: |
          zip -r backend-deploy.zip memora-backend -x "memora-backend/node_modules/*" -x "memora-backend/.git/*" -x "memora-backend/.env*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          package: backend-deploy.zip
        env:
          SCM_DO_BUILD_DURING_DEPLOYMENT: true
